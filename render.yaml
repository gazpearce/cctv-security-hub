        destination: /ethernet-upstairs-calculator.html
      - type: rewrite
        source: /garden-office-wifi-bridge-calculator
        destination: /garden-office-wifi-bridge-calculator.html
      - type: rewrite
        source: /image-gallery
        destination: /image-gallery.html
      - type: rewrite
        source: /night-vision-technology
        destination: /night-vision-technology.html
      - type: rewrite
        source: /poe-voltage-drop-calculator
        destination: /poe-voltage-drop-calculator.html
      - type: rewrite
        source: /smart-doorbell-transformer-calculator
        destination: /smart-doorbell-transformer-calculator.html
      - type: rewrite
        source: /starlink-vs-5g-cost-calculator
        destination: /starlink-vs-5g-cost-calculator.html
      - type: rewrite
